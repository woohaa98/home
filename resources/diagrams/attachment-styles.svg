<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 372" width="600" height="372" id="dg-att">
  <title>Attachment as two dimensions: anxiety and avoidance</title>
  <style>
    #dg-att text { font-family: "DM Sans", Helvetica, Arial, sans-serif; fill: #2A2F35; }
    #dg-att .h { font-family: Lora, Georgia, serif; font-size: 19px; font-weight: 500; }
    #dg-att .s { font-size: 13.5px; fill: #5A6370; }
    #dg-att .ax { font-size: 11.5px; font-weight: 600; letter-spacing: 1.4px; fill: #3D4A5C; }
    #dg-att .axs { font-size: 12.5px; fill: #5A6370; }
    #dg-att .lh { font-size: 11px; font-weight: 600; letter-spacing: 1px; fill: #6B7A8D; }
  </style>
  <defs>
    <marker id="dgt-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#3D4A5C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="dgt-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#476B56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- quadrants -->
  <rect x="64" y="8" width="262" height="146" rx="14" fill="#FBF0EA"/>
  <rect x="332" y="8" width="262" height="146" rx="14" fill="#F5EFE6"/>
  <rect x="64" y="160" width="262" height="146" rx="14" fill="#EEF4F0"/>
  <rect x="332" y="160" width="262" height="146" rx="14" fill="#EEF0F3"/>

  <text x="86" y="40" class="h" style="fill:#9A5232">Anxious</text>
  <text x="86" y="64" class="s">Craves closeness,</text>
  <text x="86" y="82" class="s">worries about being left</text>
  <text x="86" y="100" class="s">or not mattering</text>

  <text x="354" y="40" class="h" style="fill:#5A4A3A">Fearful-avoidant</text>
  <text x="354" y="64" class="s">Wants closeness but</text>
  <text x="354" y="82" class="s">fears getting hurt;</text>
  <text x="354" y="100" class="s">may move toward and away</text>

  <text x="86" y="192" class="h" style="fill:#476B56">Secure</text>
  <text x="86" y="216" class="s">Comfortable with closeness</text>
  <text x="86" y="234" class="s">and with independence;</text>
  <text x="86" y="252" class="s">trusts care is available</text>

  <text x="354" y="192" class="h" style="fill:#3D4A5C">Avoidant</text>
  <text x="354" y="216" class="s">Values independence,</text>
  <text x="354" y="234" class="s">uneasy relying on others</text>
  <text x="354" y="252" class="s">or being relied on</text>


  <!-- axes -->
  <path d="M46 306V14" stroke="#3D4A5C" stroke-width="1.6" fill="none" marker-end="url(#dgt-a)"/>
  <path d="M64 324H588" stroke="#3D4A5C" stroke-width="1.6" fill="none" marker-end="url(#dgt-a)"/>
  <text transform="translate(30 157) rotate(-90)" text-anchor="middle" class="ax">ANXIETY</text>
  <text transform="translate(14 157) rotate(-90)" text-anchor="middle" class="axs">worry about rejection</text>
  <text x="329" y="346" text-anchor="middle" class="ax">AVOIDANCE</text>
  <text x="329" y="363" text-anchor="middle" class="axs">discomfort with closeness</text>
  <text x="64" y="346" class="lh">LOW</text>
  <text x="594" y="346" text-anchor="end" class="lh">HIGH</text>
</svg>
