<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 318" width="600" height="318" id="dg-brain">
  <title>From moment to emotion, and four places to step in</title>
  <style>
    #dg-brain text { font-family: "DM Sans", Helvetica, Arial, sans-serif; fill: #2A2F35; }
    #dg-brain .h { font-size: 17px; font-weight: 600; }
    #dg-brain .s { font-size: 13.5px; fill: #5A6370; }
    #dg-brain .lab { font-size: 11.5px; font-weight: 600; letter-spacing: 1.6px; fill: #6B7A8D; }
    #dg-brain .door { font-size: 14px; font-weight: 500; fill: #2F4F3D; }
    #dg-brain .arc { font-size: 13px; font-style: italic; fill: #9A5232; font-family: Lora, Georgia, serif; }
    #dg-brain .n { font-size: 12px; font-weight: 600; fill: #fff; }
  </style>
  <defs>
    <marker id="dgb-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#6B7A8D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="dgb-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#C4714A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- feedback arc -->
  <path d="M525 60 C525 36, 75 36, 75 57" fill="none" stroke="#E8A882" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#dgb-t)"/>
  <text x="300" y="20" text-anchor="middle" class="arc">and what you do changes what happens next</text>

  <!-- four steps -->
  <g>
    <rect x="8" y="62" width="134" height="92" rx="14" fill="#fff" stroke="#B8D4C0" stroke-width="1.6"/>
    <text x="75" y="94" text-anchor="middle" class="h">Situation</text>
    <text x="75" y="117" text-anchor="middle" class="s">What happens,</text>
    <text x="75" y="134" text-anchor="middle" class="s">around or in you</text>

    <rect x="158" y="62" width="134" height="92" rx="14" fill="#fff" stroke="#B8D4C0" stroke-width="1.6"/>
    <text x="225" y="94" text-anchor="middle" class="h">Attention</text>
    <text x="225" y="117" text-anchor="middle" class="s">What you</text>
    <text x="225" y="134" text-anchor="middle" class="s">focus on</text>

    <rect x="308" y="62" width="134" height="92" rx="14" fill="#fff" stroke="#B8D4C0" stroke-width="1.6"/>
    <text x="375" y="94" text-anchor="middle" class="h">Meaning</text>
    <text x="375" y="117" text-anchor="middle" class="s">What it means,</text>
    <text x="375" y="134" text-anchor="middle" class="s">based on the past</text>

    <rect x="458" y="62" width="134" height="92" rx="14" fill="#3D4A5C"/>
    <text x="525" y="94" text-anchor="middle" class="h" style="fill:#fff">Emotion</text>
    <text x="525" y="117" text-anchor="middle" class="s" style="fill:#D9DEE5">feelings, body,</text>
    <text x="525" y="134" text-anchor="middle" class="s" style="fill:#D9DEE5">urges, actions</text>
  </g>
  <g stroke="#6B7A8D" stroke-width="1.6" fill="none">
    <path d="M143 108H155" marker-end="url(#dgb-a)"/>
    <path d="M293 108H305" marker-end="url(#dgb-a)"/>
    <path d="M443 108H455" marker-end="url(#dgb-a)"/>
  </g>

  <!-- body + past band -->
  <rect x="8" y="168" width="584" height="32" rx="16" fill="#F5EFE6"/>
  <text x="300" y="189" text-anchor="middle" class="s" style="fill:#3D4A5C">Body signals and past experience shape every step</text>

  <!-- doors -->
  <text x="8" y="230" class="lab">WHERE YOU CAN STEP IN</text>
  <g>
    <rect x="8" y="242" width="134" height="68" rx="12" fill="#EEF4F0" stroke="#7A9E87" stroke-width="1.4"/>
    <circle cx="28" cy="262" r="10" fill="#476B56"/><text x="28" y="266" text-anchor="middle" class="n">1</text>
    <text x="84" y="268" text-anchor="middle" class="door">Shape the</text>
    <text x="75" y="291" text-anchor="middle" class="door">situation</text>

    <rect x="158" y="242" width="134" height="68" rx="12" fill="#EEF4F0" stroke="#7A9E87" stroke-width="1.4"/>
    <circle cx="178" cy="262" r="10" fill="#476B56"/><text x="178" y="266" text-anchor="middle" class="n">2</text>
    <text x="234" y="268" text-anchor="middle" class="door">Shift your</text>
    <text x="225" y="291" text-anchor="middle" class="door">attention</text>

    <rect x="308" y="242" width="134" height="68" rx="12" fill="#EEF4F0" stroke="#7A9E87" stroke-width="1.4"/>
    <circle cx="328" cy="262" r="10" fill="#476B56"/><text x="328" y="266" text-anchor="middle" class="n">3</text>
    <text x="384" y="268" text-anchor="middle" class="door">Rethink the</text>
    <text x="375" y="291" text-anchor="middle" class="door">meaning</text>

    <rect x="458" y="242" width="134" height="68" rx="12" fill="#EEF4F0" stroke="#7A9E87" stroke-width="1.4"/>
    <circle cx="478" cy="262" r="10" fill="#476B56"/><text x="478" y="266" text-anchor="middle" class="n">4</text>
    <text x="534" y="268" text-anchor="middle" class="door">Soothe the</text>
    <text x="525" y="291" text-anchor="middle" class="door">body</text>
  </g>
</svg>
