<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 362" width="600" height="362" id="dg-anx">
  <title>The anxiety cycle and a way out</title>
  <style>
    #dg-anx text { font-family: "DM Sans", Helvetica, Arial, sans-serif; fill: #2A2F35; }
    #dg-anx .h { font-size: 16px; font-weight: 600; }
    #dg-anx .s { font-size: 13px; fill: #5A6370; }
    #dg-anx .c { font-family: Lora, Georgia, serif; font-style: italic; font-size: 17px; fill: #3D4A5C; }
    #dg-anx .cs { font-size: 12.5px; fill: #5A6370; }
    #dg-anx .lab { font-size: 11.5px; font-weight: 600; letter-spacing: 1.6px; fill: #476B56; }
    #dg-anx .g { font-size: 15px; font-weight: 600; fill: #2F4F3D; }
    #dg-anx .gs { font-size: 13px; fill: #2F4F3D; }
  </style>
  <defs>
    <marker id="dga-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#476B56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- loop track -->
  <ellipse cx="215" cy="185" rx="140" ry="133" fill="none" stroke="#E8A882" stroke-width="2"/>
  <g fill="#C4714A">
    <path d="M-6 -6L6 0L-6 6Z" transform="translate(285 70.8) rotate(30)"/>
    <path d="M-6 -6L6 0L-6 6Z" transform="translate(355 185) rotate(90)"/>
    <path d="M-6 -6L6 0L-6 6Z" transform="translate(285 300.2) rotate(150)"/>
    <path d="M-6 -6L6 0L-6 6Z" transform="translate(145 300.2) rotate(210)"/>
    <path d="M-6 -6L6 0L-6 6Z" transform="translate(75 185) rotate(270)"/>
    <path d="M-6 -6L6 0L-6 6Z" transform="translate(145 70.8) rotate(330)"/>
  </g>
  <text x="215" y="180" text-anchor="middle" class="c">The avoidance loop</text>
  <text x="215" y="201" text-anchor="middle" class="cs">relief now, more fear later</text>

  <!-- nodes -->
  <g>
    <rect x="145" y="24" width="140" height="56" rx="14" fill="#fff" stroke="#E8A882" stroke-width="1.6"/>
    <text x="215" y="47" text-anchor="middle" class="h">Trigger</text>
    <text x="215" y="67" text-anchor="middle" class="s">a situation or thought</text>

    <rect x="285" y="92" width="140" height="56" rx="14" fill="#fff" stroke="#E8A882" stroke-width="1.6"/>
    <text x="355" y="115" text-anchor="middle" class="h">“What if...?”</text>
    <text x="355" y="135" text-anchor="middle" class="s">brain predicts danger</text>

    <rect x="285" y="222" width="140" height="56" rx="14" fill="#fff" stroke="#E8A882" stroke-width="1.6"/>
    <text x="355" y="245" text-anchor="middle" class="h">Anxiety rises</text>
    <text x="355" y="265" text-anchor="middle" class="s">racing heart, worry</text>

    <rect x="145" y="290" width="140" height="56" rx="14" fill="#FBF0EA" stroke="#C4714A" stroke-width="1.6"/>
    <text x="215" y="313" text-anchor="middle" class="h">Avoid or escape</text>
    <text x="215" y="333" text-anchor="middle" class="s">or seek reassurance</text>

    <rect x="5" y="222" width="140" height="56" rx="14" fill="#fff" stroke="#E8A882" stroke-width="1.6"/>
    <text x="75" y="245" text-anchor="middle" class="h">Quick relief</text>
    <text x="75" y="265" text-anchor="middle" class="s">it seems to work</text>

    <rect x="5" y="92" width="140" height="56" rx="14" fill="#fff" stroke="#E8A882" stroke-width="1.6"/>
    <text x="75" y="115" text-anchor="middle" class="h">Fear grows</text>
    <text x="75" y="135" text-anchor="middle" class="s">“I couldn't have coped”</text>
  </g>

  <!-- the way out -->
  <text x="452" y="40" class="lab">A WAY OUT</text>
  <path d="M426 250H448" fill="none" stroke="#476B56" stroke-width="1.8" marker-end="url(#dga-g)"/>
  <rect x="452" y="200" width="143" height="100" rx="14" fill="#EEF4F0" stroke="#7A9E87" stroke-width="1.6"/>
  <text x="523" y="229" text-anchor="middle" class="g">Approach,</text>
  <text x="523" y="249" text-anchor="middle" class="g">step by step</text>
  <text x="523" y="272" text-anchor="middle" class="gs">stay long enough</text>
  <text x="523" y="289" text-anchor="middle" class="gs">to learn</text>
  <path d="M523 198V160" fill="none" stroke="#476B56" stroke-width="1.8" marker-end="url(#dga-g)"/>
  <rect x="452" y="56" width="143" height="100" rx="14" fill="#476B56"/>
  <text x="523" y="86" text-anchor="middle" class="g" style="fill:#fff">New learning</text>
  <text x="523" y="110" text-anchor="middle" class="gs" style="fill:#E6EFE9">“That was hard,</text>
  <text x="523" y="127" text-anchor="middle" class="gs" style="fill:#E6EFE9">and I coped.”</text>
  <text x="523" y="145" text-anchor="middle" class="gs" style="fill:#E6EFE9">The alarm quiets.</text>
</svg>
