<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 352" width="600" height="352" id="dg-val">
  <title>Values are a direction; goals are places you reach along the way</title>
  <style>
    #dg-val text { font-family: "DM Sans", Helvetica, Arial, sans-serif; fill: #2A2F35; }
    #dg-val .lab { font-size: 11.5px; font-weight: 600; letter-spacing: 1.6px; }
    #dg-val .v { font-family: Lora, Georgia, serif; font-style: italic; font-size: 18px; fill: #2F4F3D; }
    #dg-val .s { font-size: 13px; fill: #5A6370; }
    #dg-val .h { font-size: 16px; font-weight: 600; }
    #dg-val .li { font-size: 13.5px; }
    #dg-val .q { font-family: Lora, Georgia, serif; font-style: italic; font-size: 14px; }
  </style>
  <defs>
    <marker id="dgv-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#476B56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- compass -->
  <circle cx="44" cy="88" r="36" fill="#fff" stroke="#7A9E87" stroke-width="1.8"/>
  <circle cx="44" cy="88" r="28" fill="none" stroke="#B8D4C0" stroke-width="1"/>
  <path d="M30 88L44 81L74 88L44 95Z" fill="#476B56"/>
  <path d="M30 88L44 81L44 95Z" fill="#B8D4C0"/>
  <circle cx="44" cy="88" r="3" fill="#fff"/>

  <!-- direction -->
  <text x="96" y="20" class="lab" style="fill:#476B56">VALUE · THE DIRECTION</text>
  <text x="96" y="44" class="v">being a caring presence</text>
  <path d="M84 88H590" stroke="#7A9E87" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#dgv-a)"/>
  <text x="590" y="44" text-anchor="end" class="s">never “done,” always available</text>

  <!-- goals as flags -->
  <g>
    <path d="M190 88V62" stroke="#3D4A5C" stroke-width="1.6"/><path d="M190 62L208 67L190 73Z" fill="#C4714A"/>
    <circle cx="190" cy="88" r="5" fill="#fff" stroke="#3D4A5C" stroke-width="1.6"/>
    <path d="M186 88l3 3 5-6" fill="none" stroke="#476B56" stroke-width="1.8" stroke-linecap="round"/>
    <text x="190" y="114" text-anchor="middle" class="s">Weekly call</text>
    <text x="190" y="130" text-anchor="middle" class="s">with a friend</text>

    <path d="M330 88V62" stroke="#3D4A5C" stroke-width="1.6"/><path d="M330 62L348 67L330 73Z" fill="#C4714A"/>
    <circle cx="330" cy="88" r="5" fill="#fff" stroke="#3D4A5C" stroke-width="1.6"/>
    <text x="330" y="114" text-anchor="middle" class="s">Volunteer</text>
    <text x="330" y="130" text-anchor="middle" class="s">once a month</text>

    <path d="M470 88V62" stroke="#3D4A5C" stroke-width="1.6"/><path d="M470 62L488 67L470 73Z" fill="#C4714A"/>
    <circle cx="470" cy="88" r="5" fill="#fff" stroke="#3D4A5C" stroke-width="1.6"/>
    <text x="470" y="114" text-anchor="middle" class="s">Plan a</text>
    <text x="470" y="130" text-anchor="middle" class="s">family trip</text>
  </g>
  <text x="96" y="156" class="lab" style="fill:#9A5232">GOALS · PLACES YOU REACH ALONG THE WAY</text>

  <!-- comparison -->
  <rect x="4" y="176" width="292" height="168" rx="16" fill="#EEF4F0"/>
  <text x="24" y="206" class="h" style="fill:#2F4F3D">Values</text>
  <g class="li">
    <circle cx="28" cy="229" r="3" fill="#7A9E87"/><text x="40" y="234" class="li">Qualities of how you act</text>
    <circle cx="28" cy="253" r="3" fill="#7A9E87"/><text x="40" y="258" class="li">Available right now</text>
    <circle cx="28" cy="277" r="3" fill="#7A9E87"/><text x="40" y="282" class="li">Never finished</text>
  </g>
  <text x="24" y="318" class="q" style="fill:#2F4F3D">“How do I want to show up?”</text>

  <rect x="304" y="176" width="292" height="168" rx="16" fill="#FBF0EA"/>
  <text x="324" y="206" class="h" style="fill:#7A4A33">Goals</text>
  <g>
    <circle cx="328" cy="229" r="3" fill="#C4714A"/><text x="340" y="234" class="li">Specific outcomes</text>
    <circle cx="328" cy="253" r="3" fill="#C4714A"/><text x="340" y="258" class="li">Can be achieved, checked off</text>
    <circle cx="328" cy="277" r="3" fill="#C4714A"/><text x="340" y="282" class="li">Focused on the future</text>
  </g>
  <text x="324" y="318" class="q" style="fill:#7A4A33">“What do I want to get?”</text>
</svg>
