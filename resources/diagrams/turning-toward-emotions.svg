<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 364" width="600" height="364" id="dg-turn">
  <title>Three ways to meet an uncomfortable feeling</title>
  <style>
    #dg-turn text { font-family: "DM Sans", Helvetica, Arial, sans-serif; fill: #2A2F35; }
    #dg-turn .h { font-size: 15.5px; font-weight: 600; }
    #dg-turn .s { font-size: 13px; fill: #5A6370; }
    #dg-turn .lab { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; }
    #dg-turn .st { font-size: 14px; font-weight: 500; fill: #2F4F3D; }
    #dg-turn .n { font-size: 11.5px; font-weight: 600; fill: #fff; }
    #dg-turn .it { font-family: Lora, Georgia, serif; font-style: italic; font-size: 13.5px; }
  </style>
  <defs>
    <marker id="dgt2-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#C4714A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="dgt2-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#476B56" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- the feeling -->
  <rect x="170" y="6" width="260" height="54" rx="14" fill="#3D4A5C"/>
  <text x="300" y="29" text-anchor="middle" class="h" style="fill:#fff">An uncomfortable feeling</text>
  <text x="300" y="48" text-anchor="middle" class="s" style="fill:#D9DEE5">sadness, shame, loneliness, anger</text>

  <path d="M205 61 C 160 72, 110 76, 105 93" fill="none" stroke="#C4714A" stroke-width="1.8" marker-end="url(#dgt2-t)"/>
  <path d="M290 61 V93" fill="none" stroke="#C4714A" stroke-width="1.8" marker-end="url(#dgt2-t)"/>
  <path d="M395 61 C 440 72, 490 76, 496 93" fill="none" stroke="#476B56" stroke-width="1.8" marker-end="url(#dgt2-g)"/>

  <!-- think it away / push it away -->
  <rect x="16" y="96" width="178" height="76" rx="14" fill="#fff" stroke="#E8A882" stroke-width="1.4"/>
  <text x="105" y="117" text-anchor="middle" class="lab" style="fill:#9A5232">THINK IT AWAY</text>
  <text x="105" y="140" text-anchor="middle" class="h">Analyze &amp; explain</text>
  <text x="105" y="159" text-anchor="middle" class="s">“Why? What's the fix?”</text>

  <rect x="202" y="96" width="178" height="76" rx="14" fill="#fff" stroke="#E8A882" stroke-width="1.4"/>
  <text x="291" y="117" text-anchor="middle" class="lab" style="fill:#9A5232">PUSH IT AWAY</text>
  <text x="291" y="140" text-anchor="middle" class="h">Numb or distract</text>
  <text x="291" y="159" text-anchor="middle" class="s">scroll, snack, shop, work</text>

  <g stroke="#C4714A" stroke-width="1.8" fill="none">
    <path d="M105 173V193" marker-end="url(#dgt2-t)"/>
    <path d="M291 173V193" marker-end="url(#dgt2-t)"/>
  </g>
  <rect x="16" y="196" width="364" height="58" rx="14" fill="#FBF0EA" stroke="#C4714A" stroke-width="1.4"/>
  <text x="198" y="220" text-anchor="middle" class="h">Quick relief</text>
  <text x="198" y="240" text-anchor="middle" class="s">but the feeling stays underneath, unheard</text>

  <path d="M105 255 V282 H6 V33 H166" fill="none" stroke="#E8A882" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#dgt2-t)"/>
  <text x="198" y="304" text-anchor="middle" class="it" style="fill:#9A5232">and it often returns, sometimes louder</text>

  <!-- turn toward it -->
  <rect x="396" y="96" width="198" height="262" rx="16" fill="#EEF4F0" stroke="#7A9E87" stroke-width="1.4"/>
  <text x="495" y="117" text-anchor="middle" class="lab" style="fill:#476B56">TURN TOWARD IT</text>
  <g>
    <circle cx="416" cy="141" r="9.5" fill="#476B56"/><text x="416" y="145" text-anchor="middle" class="n">1</text>
    <text x="433" y="146" class="st">Notice it in your body</text>
    <circle cx="416" cy="177" r="9.5" fill="#476B56"/><text x="416" y="181" text-anchor="middle" class="n">2</text>
    <text x="433" y="182" class="st">Name it</text>
    <circle cx="416" cy="213" r="9.5" fill="#476B56"/><text x="416" y="217" text-anchor="middle" class="n">3</text>
    <text x="433" y="218" class="st">Make room for it</text>
    <circle cx="416" cy="249" r="9.5" fill="#476B56"/><text x="416" y="253" text-anchor="middle" class="n">4</text>
    <text x="433" y="254" class="st">Meet it with kindness</text>
  </g>
  <path d="M406 330 C 446 330, 466 280, 495 280 C 524 280, 544 330, 584 330" fill="none" stroke="#476B56" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M406 330 C 446 330, 466 280, 495 280 C 524 280, 544 330, 584 330 Z" fill="#B8D4C0" fill-opacity="0.45"/>
  <text x="495" y="348" text-anchor="middle" class="it" style="fill:#2F4F3D">it rises, peaks, and passes</text>
</svg>
